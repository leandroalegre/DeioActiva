services:
  mysql:
    image: mysql:8.0
    container_name: deioactiva-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: deioactiva
      MYSQL_USER: deioactiva
      MYSQL_PASSWORD: deioactiva
    ports:
      - "3306:3306"
    volumes:
      - deioactiva_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deioactiva_mysql_data:
